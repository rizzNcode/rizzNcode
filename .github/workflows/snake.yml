name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#7EC8FF&color_dots=#161b22,#12397A,#1E5AA8,#4A9BE8,#7EC8FF
            dist/github-snake.svg?color_snake=#1E5AA8&color_dots=#ebedf0,#A8D4FF,#5BA8F0,#1E5AA8,#0A1F44

      - name: Apply gradient to snake body
        run: |
          # versi dark: kepala biru sangat muda -> ekor navy
          sed -i 's|</style>|.s.s0{fill:#D6EFFF}.s.s1{fill:#7EC8FF}.s.s2{fill:#4A9BE8}.s.s3{fill:#2E6FCC}.s.s4,.s.s5,.s.s6,.s.s7,.s.s8,.s.s9{fill:#1E5AA8}</style>|' dist/github-snake-dark.svg
          # versi light: kepala navy -> ekor biru muda
          sed -i 's|</style>|.s.s0{fill:#0A1F44}.s.s1{fill:#12397A}.s.s2{fill:#1E5AA8}.s.s3{fill:#4A9BE8}.s.s4,.s.s5,.s.s6,.s.s7,.s.s8,.s.s9{fill:#7EC8FF}</style>|' dist/github-snake.svg

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
