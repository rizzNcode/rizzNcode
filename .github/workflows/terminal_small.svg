<svg xmlns="http://www.w3.org/2000/svg" width="446" height="498" viewBox="0 0 446 498" role="img" aria-label="Potret ASCII Rizki dalam jendela terminal">
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="42" x2="0" y2="464">
      <stop offset="0" stop-color="#7EC8FF"/>
      <stop offset="0.55" stop-color="#4FD8FF"/>
      <stop offset="1" stop-color="#1E5AA8"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7EC8FF"/>
      <stop offset="1" stop-color="#1E5AA8"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#050B16"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.28"/>
    </pattern>
    <clipPath id="win"><rect x="1.5" y="1.5" width="443" height="495" rx="14"/></clipPath>
  </defs>
  <style>
    .r { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, "Courier New", monospace;
         font-size: 6.3px; fill: url(#ink); opacity: 0; animation: show .35s ease-out forwards; }
    @keyframes show { to { opacity: 1; } }
    .t { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, "Courier New", monospace; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { from { transform: translateY(0); } to { transform: translateY(498px); } }
    .sweep { animation: sweep 6s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .r { animation: none; opacity: 1; } .cursor, .sweep { animation: none; } }
  </style>

  <!-- jendela -->
  <rect x="1.5" y="1.5" width="443" height="495" rx="14" fill="url(#bg)" stroke="url(#frame)" stroke-width="2"/>

  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="0" y="0" width="446" height="30" fill="#0E2547"/>
    <line x1="0" y1="30" x2="446" y2="30" stroke="#1E5AA8" stroke-width="1"/>
    <circle cx="22" cy="15" r="5.5" fill="#FF5F57"/>
    <circle cx="42" cy="15" r="5.5" fill="#FEBC2E"/>
    <circle cx="62" cy="15" r="5.5" fill="#28C840"/>
    <text class="t" x="223" y="19" text-anchor="middle" font-size="11" fill="#7EC8FF">rizki/README.md</text>

